name: Gera os cards de estatistica

# Gera stats.svg e top-langs.svg e publica na branch "output", junto com a
# cobrinha e o grafico de atividade. Feito em casa porque a instancia publica
# do github-readme-stats vive respondendo 503/429 por estourar a cota do
# Vercel, e a alternativa seria manter um fork hospedado so para isso.

on:
  schedule:
    # todo dia as 03:20 UTC, depois da cobrinha e do grafico
    - cron: "20 3 * * *"
  # permite rodar na mao pelo botao "Run workflow"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gera os SVGs
        env:
          # O GITHUB_TOKEN padrao do Actions so enxerga contribuicao publica,
          # entao os numeros saem subestimados. Para contar tambem o trabalho
          # em repositorio privado, criar um Personal Access Token classico
          # com escopo "repo" + "read:user" e salvar como secret STATS_TOKEN;
          # a linha abaixo o usa sempre que ele existir.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/stats_card.py \
            "${{ github.repository_owner }}" dist/stats.svg dist/top-langs.svg

      # Mesmo cuidado dos outros dois workflows: a action de publicacao troca
      # a branch "output" inteira pelo conteudo de dist/. Traz o que ja esta la.
      - name: Preserva os SVGs dos outros workflows
        run: |
          git fetch origin output --depth 1 || exit 0
          for f in $(git ls-tree --name-only origin/output); do
            [ -e "dist/$f" ] || git show "origin/output:$f" > "dist/$f"
          done
          ls -la dist/

      - name: Publica na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
